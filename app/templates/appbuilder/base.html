{% extends "appbuilder/baselayout.html" %}

{% block head_css %}
{{ super() }}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family: 'Inter', sans-serif;
    background:#f3f4f6;
}

/* NAVBAR */
.navbar{
    background:#111827 !important;
    border:none;
    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.navbar-brand{
    color:white !important;
    font-weight:700;
    font-size:22px;
}

.navbar-nav > li > a{
    color:#d1d5db !important;
}

.navbar-nav > li > a:hover{
    color:#fff !important;
}

/* PANELS */
.panel{
    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:
    0 4px 25px rgba(0,0,0,.08);
}

.panel-heading{
    background:#fff !important;
    border:none !important;
    font-weight:600;
}

/* TABLE */
.table{
    background:white;
}

.table-striped tbody tr:hover{
    background:#eff6ff;
    transition:.2s;
}

.table > thead{
    background:#f9fafb;
}

.table > thead > tr > th{
    border:none !important;
    color:#374151;
    font-weight:600;
}

/* BUTTONS */
.btn{
    border-radius:12px;
    font-weight:600;
}

.btn-primary{
    background:#2563eb;
    border:none;
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-sm{
    padding:8px 12px;
}

/* FORMS */
.form-control{
    border-radius:12px;
    border:1px solid #d1d5db;
    box-shadow:none;
    height:45px;
}

.form-control:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

/* TITLES */
h1,h2,h3{
    color:#111827;
    font-weight:700;
}

/* ALERT */
.alert{
    border-radius:15px;
    border:none;
}

/* CARDS EFFECT */
.row .col-sm-12{
    animation: fadeIn .4s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

{% endblock %}
