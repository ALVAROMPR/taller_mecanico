{% extends 'appbuilder/base.html' %}

{% block content %}

<div class="container-fluid">

    <h2>Dashboard Taller Mecánico</h2>
    <hr>

    <div class="row">

        <div class="col-md-3">
            <div class="well text-center">
                <h3>{{ total_clientes }}</h3>
                <p>Total Clientes</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="well text-center">
                <h3>{{ total_vehiculos }}</h3>
                <p>Total Vehículos</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="well text-center">
                <h3>{{ total_ordenes }}</h3>
                <p>Total Órdenes</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="well text-center">
                <h3>Bs {{ ingresos_totales }}</h3>
                <p>Ingresos Totales</p>
            </div>
        </div>

    </div>

    <hr>

    <h3>Servicios más utilizados</h3>

    <canvas id="graficaServicios"></canvas>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const ctx = document.getElementById('graficaServicios');

    const labels = [
        {% for servicio in servicios_populares %}
            "{{ servicio[0] }}",
        {% endfor %}
    ];

    const data = [
        {% for servicio in servicios_populares %}
            {{ servicio[1] }},
        {% endfor %}
    ];

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Cantidad de Servicios',
                data: data
            }]
        }
    });
</script>

{% endblock %}
